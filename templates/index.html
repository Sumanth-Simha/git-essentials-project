<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Expense Tracker</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; }
      form, section { border: 1px solid #ddd; border-radius: .5rem; margin: 1rem 0; padding: 1rem; }
      input, button { font: inherit; padding: .5rem; }
      li { margin: .35rem 0; }
      #message { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <h1>Student Expense Tracker</h1>
    <section>
      <h2>Add expense</h2>
      <form id="expense-form">
        <label>Amount <input id="expense" name="expense" type="number" min="0" step="0.01" required></label>
        <button type="submit">Add</button>
      </form>
      <p id="message" role="status"></p>
    </section>
    <section>
      <h2>Expenses</h2>
      <ul id="expenses">
        {% for expense in expenses %}
        <li>{{ expense }}</li>
        {% else %}
        <li>No expenses yet.</li>
        {% endfor %}
      </ul>
      <strong>Total: {{ "%.2f"|format(total) }}</strong>
    </section>
    <section>
      <h2>Split total</h2>
      <form id="split-form">
        <label>People <input id="people" name="people" type="number" min="1" step="1" required></label>
        <button type="submit">Calculate</button>
      </form>
      <p id="split-result"></p>
    </section>
    <script>
      const message = document.querySelector("#message");
      document.querySelector("#expense-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const expense = document.querySelector("#expense").value;
        const response = await fetch("/expenses", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({expense})
        });
        const data = await response.json();
        if (!response.ok) {
          message.textContent = data.error;
          return;
        }
        message.textContent = `Expense ${data.expense} added.`;
        window.location.reload();
      });

      document.querySelector("#split-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const people = document.querySelector("#people").value;
        const response = await fetch(`/expenses/split?people=${people}`);
        const data = await response.json();
        document.querySelector("#split-result").textContent = response.ok
          ? `Each person should pay ${data.per_person.toFixed(2)}.`
          : data.error;
      });
    </script>
  </body>
</html>
